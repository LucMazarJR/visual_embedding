services:
  backend:
    build: ./back
    container_name: backend_dev
    ports:
      - "3001:3001"
    volumes:
      - ./back:/app
      - /app/node_modules
    env_file:
      - ./back/.env
    environment:
      - NODE_ENV=development
    command: npm run dev

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared_tunnel
    depends_on:
      - backend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    restart: unless-stopped
    profiles:
      - tunnel